[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concession"
version = "0.1.0"
description = "Atendimento com RAG para concessoes de mobiliario urbano: prazo de contrato e prazo LGPD no mesmo console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "starlette>=1.0.1,<2.0.0",
    "langchain-anthropic>=1.4.3,<2.0.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-openai>=1.1.14,<2.0.0",
    "langchain-text-splitters>=1.1.2,<2.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "requests>=2.32.0,<3.0.0",
    "cryptography>=50.0.2,<51.0.0",
]

[project.optional-dependencies]
chroma = [
    "langchain-chroma>=1.1.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
]
s3 = [
    "boto3>=1.34.0,<2.0.0",
]
redis = [
    "redis>=5.0.0,<6.0.0",
]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.17.0,<0.18.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["concession.egg-info"]

[tool.ruff.lint]
# Gate de correcao, nao de estilo: erros de sintaxe e de import, nome
# indefinido, import e variavel sem uso (pyflakes). Ampliar aos poucos.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts ajustam sys.path antes de importar o pacote app.
"scripts/*" = ["E402"]
