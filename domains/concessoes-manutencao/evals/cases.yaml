domain: concessoes-manutencao
# Casos base do canal de manutencao. Cada defeito precisa (1) recuperar o
# artigo com o item do anexo de niveis de servico e (2) levantar o motivo de
# handoff que define a prioridade do chamado (e, portanto, o prazo do console):
#   risco_seguranca -> urgent (4h) | tela_inoperante, notificacao_fiscalizacao -> high (24h)
#   informacao_incorreta -> normal (48h) | conservacao_limpeza -> low (5d)
# Prazos ficticios de demonstracao: ver knowledge/articles/anexo-niveis-de-servico.md.
cases:
  - id: risco-fio-exposto-abrigo
    category: risco_seguranca
    question: Tem um fio exposto soltando faisca no abrigo de onibus ABR-1104 na Paulista.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
        # orientacao de seguranca fixa (notice), presente mesmo sem LLM
        - ligue 193
      expected_references:
        - risco-seguranca.md
      required_handoff_reasons:
        - risco_seguranca
      allowed_handoff_reasons:
        - risco_seguranca
        - low_confidence
        - provider_error
    # Modo LLM real apenas (--provider-mode real). Prazo e item vem de
    # knowledge/faqs/risco-seguranca.md (item 3.1, 4 horas, demo).
    llm_expectation:
      any_of:
        - ["4 horas", "4h"]
        - ["3.1"]
        - ["193", "190", "afaste"]
      allowed_durations:
        - 4 horas
      expected_citation:
        - pattern: 'item\s*3\.1'
          source: risco-seguranca.md

  - id: risco-vidro-quebrado
    category: risco_seguranca
    question: O vidro do abrigo esta quebrado e com pedacos no chao, alguem pode se cortar.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
        # orientacao de seguranca fixa (notice), presente mesmo sem LLM
        - ligue 193
      expected_references:
        - risco-seguranca.md
      required_handoff_reasons:
        - risco_seguranca
      allowed_handoff_reasons:
        - risco_seguranca
        - low_confidence
        - provider_error

  - id: tela-apagada-relogio-pinheiros
    category: tela_inoperante
    question: O relogio REL-0423 na Teodoro Sampaio esta com a tela apagada desde ontem.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      expected_references:
        - tela-apagada.md
      required_handoff_reasons:
        - tela_inoperante
      allowed_handoff_reasons:
        - tela_inoperante
        - low_confidence
        - provider_error
    # Modo LLM real: knowledge/faqs/tela-apagada.md (item 3.2, 24 horas, demo).
    llm_expectation:
      any_of:
        - ["24 horas", "24h"]
        - ["3.2"]
      allowed_durations:
        - 24 horas
      expected_citation:
        - pattern: 'item\s*3\.2'
          source: tela-apagada.md

  - id: painel-metro-travado
    category: tela_inoperante
    question: O painel digital do mezanino da estacao esta travado e piscando.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      expected_references:
        - tela-apagada.md
      required_handoff_reasons:
        - tela_inoperante
      allowed_handoff_reasons:
        - tela_inoperante
        - low_confidence
        - provider_error

  - id: relogio-hora-errada
    category: informacao_incorreta
    question: O relogio da Avenida Paulista esta mostrando a hora errada, uma hora atrasado.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      expected_references:
        - hora-temperatura-errada.md
      required_handoff_reasons:
        - informacao_incorreta
      allowed_handoff_reasons:
        - informacao_incorreta
        - low_confidence
        - provider_error
    # Modo LLM real: knowledge/faqs/hora-temperatura-errada.md (item 3.3, 48 horas, demo).
    llm_expectation:
      any_of:
        - ["48 horas", "48h"]
        - ["3.3"]
      allowed_durations:
        - 48 horas

  - id: pichacao-relogio
    category: conservacao_limpeza
    question: Picharam o relogio da Praca da Se, ficou todo pichado.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      expected_references:
        - pichacao-limpeza.md
      required_handoff_reasons:
        - conservacao_limpeza
      allowed_handoff_reasons:
        - conservacao_limpeza
        - low_confidence
        - provider_error
    # Modo LLM real: knowledge/faqs/pichacao-limpeza.md (item 3.4, 5 dias, demo).
    # O mesmo artigo cita 4 horas (item 3.1) para vandalismo com risco, entao
    # mencionar esse prazo nao e alucinacao.
    llm_expectation:
      any_of:
        - ["5 dias"]
        - ["3.4"]
      allowed_durations:
        - 5 dias
        - 4 horas

  - id: vandalismo-com-risco-prioriza-risco
    category: risco_seguranca
    question: Picharam o abrigo e quebraram o vidro, tem vidro quebrado no banco.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      expected_references:
        - pichacao-limpeza.md
      required_handoff_reasons:
        - risco_seguranca
        - conservacao_limpeza
      allowed_handoff_reasons:
        - risco_seguranca
        - conservacao_limpeza
        - low_confidence
        - provider_error

  - id: notificacao-fiscalizacao
    category: notificacao_fiscalizacao
    question: Recebemos uma notificacao da fiscalizacao sobre o relogio REL-0215, qual o valor da multa?
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
        # prazo fixo (notice), presente mesmo sem LLM
        - 24 horas
      expected_references:
        - fiscalizacao-notificacao.md
      required_handoff_reasons:
        - notificacao_fiscalizacao
      allowed_handoff_reasons:
        - notificacao_fiscalizacao
        - legal_risk
        - sensitive_topic
        - low_confidence
        - provider_error
    # Modo LLM real: knowledge/faqs/fiscalizacao-notificacao.md (item 3.5,
    # 24 horas, demo). O canal nunca informa valor de multa.
    llm_expectation:
      any_of:
        - ["24 horas", "24h"]
        - ["humano", "equipe de contrato", "pessoa da equipe", "encaminh"]
      forbidden_terms:
        - "r$"
      allowed_durations:
        - 24 horas

  - id: como-registrar-sem-codigo
    category: registro
    question: Nao achei o codigo do equipamento, como faco para registrar um defeito no abrigo?
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      expected_references:
        - como-registrar-defeito.md
      allowed_handoff_reasons:
        - low_confidence
        - provider_error
    # Modo LLM real: no modo deterministico este caso so escala por
    # provider_error. Com resposta do modelo, a confianca do retrieval basta e
    # o caso nao escala.
    llm_expectation:
      should_escalate: false
      any_of:
        - ["endereco", "ponto de referencia"]

  - id: pedido-humano
    category: handoff_explicito
    question: Quero falar com um atendente sobre um abrigo que nunca foi consertado.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      required_handoff_reasons:
        - explicit_human_request
      allowed_handoff_reasons:
        - explicit_human_request
        - low_confidence
        - provider_error

  # Casos negativos: o termo aparece, mas o sentido nao e o da regra. Provam que
  # ignore_terms tira o falso positivo sem esconder o risco real. O motivo
  # exigido garante que o defeito vira caso mesmo quando o LLM responde com
  # confianca (no eval com LLM real, sem regra, ele nao entrava na fila).
  - id: negativo-sem-risco-nao-e-urgente
    category: precisao_classificacao
    question: O banco do abrigo ABR-1290 esta solto, mas sem risco, so balancando.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      required_handoff_reasons:
        - defeito_geral
      allowed_handoff_reasons:
        - defeito_geral
        - low_confidence
        - out_of_scope
        - provider_error

  - id: risco-real-mesmo-com-sem-risco
    category: risco_seguranca
    question: Tem fio exposto no abrigo ABR-1377, sem risco?
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      expected_references:
        - risco-seguranca.md
      required_handoff_reasons:
        - risco_seguranca
      allowed_handoff_reasons:
        - risco_seguranca
        - low_confidence
        - provider_error

  - id: negativo-tecnico-atrasado
    category: precisao_classificacao
    question: O tecnico esta atrasado para consertar o relogio REL-0101.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      required_handoff_reasons:
        - cobranca_atendimento
      allowed_handoff_reasons:
        - cobranca_atendimento
        - low_confidence
        - out_of_scope
        - provider_error

  # Casamento por inicio de palavra, com intervalo curto e negacao simples
  # (app/handoff/term_match.py). Positivos: o termo aparece com palavras no
  # meio, no plural ou perto de um "nao" que nao nega o risco. Negativos: a
  # negacao ou o meio de outra palavra nao podem abrir o motivo da regra.
  - id: positivo-palavras-entre-termos
    category: tela_inoperante
    question: O relogio REL-0423 esta apagado desde ontem.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      required_handoff_reasons:
        - tela_inoperante
      allowed_handoff_reasons:
        - tela_inoperante
        - low_confidence
        - provider_error

  - id: positivo-risco-plural-com-nao-perto
    category: risco_seguranca
    question: Tem fios expostos no abrigo ABR-1104, nao chegue perto.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
        - ligue 193
      required_handoff_reasons:
        - risco_seguranca
      allowed_handoff_reasons:
        - risco_seguranca
        - low_confidence
        - provider_error

  - id: positivo-estrutura-solta-com-codigo-no-meio
    category: risco_seguranca
    question: "Nao toque: a estrutura do abrigo ABR-1501 esta solta."
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
        - ligue 193
      required_handoff_reasons:
        - risco_seguranca
      allowed_handoff_reasons:
        - risco_seguranca
        - defeito_geral
        - low_confidence
        - provider_error

  - id: negativo-negacao-nenhum-risco
    category: precisao_classificacao
    question: Nao ha nenhum risco, o abrigo ABR-1290 so esta sujo.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      forbidden_terms:
        - ligue 193
      required_handoff_reasons:
        - conservacao_limpeza
      allowed_handoff_reasons:
        - conservacao_limpeza
        - low_confidence
        - out_of_scope
        - provider_error

  - id: negativo-negacao-no-meio-do-termo
    category: precisao_classificacao
    question: O painel PNL-0310 nao esta apagado, so tem um adesivo colado.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      required_handoff_reasons:
        - conservacao_limpeza
      allowed_handoff_reasons:
        - conservacao_limpeza
        - low_confidence
        - out_of_scope
        - provider_error

  - id: negativo-termo-no-meio-da-palavra
    category: precisao_classificacao
    # "risco" dentro de "arrisco" casava por substring e virava urgente.
    question: Arrisco dizer que e so sujeira no abrigo ABR-1290.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      forbidden_terms:
        - ligue 193
      required_handoff_reasons:
        - conservacao_limpeza
      allowed_handoff_reasons:
        - conservacao_limpeza
        - low_confidence
        - out_of_scope
        - provider_error

  - id: negativo-tecnico-ja-atrasado
    category: precisao_classificacao
    # "tecnico atrasado" em ignore_terms cobre as palavras no meio ("ja esta").
    question: O tecnico ja esta atrasado para consertar o relogio REL-0101.
    expectation:
      should_escalate: true
      required_terms:
        - atendimento humano
      required_handoff_reasons:
        - cobranca_atendimento
      allowed_handoff_reasons:
        - cobranca_atendimento
        - low_confidence
        - out_of_scope
        - provider_error
